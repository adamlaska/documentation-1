<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" aria-labelledby="title desc" role="img" viewBox="0 0 1440 560"><title id="title">ACE managed offchain risk screening flow</title><desc id="desc">An application requests an evaluation from ACE. A managed CRE workflow screens addresses with TRM, writes an approved permit to the CADV contract, and the application submits the protected transaction after the permit is ready.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#375bd2" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.accent,.box{stroke-width:2;rx:16}.box{fill:#fff;stroke:#d6d9e0}.accent{fill:#f1f5ff;stroke:#375bd2}.body,.label,.title{text-anchor:middle}.title{fill:#161b26;font:600 22px Arial,sans-serif}.body{fill:#4c5367;font:16px Arial,sans-serif}.label{fill:#375bd2;font:600 15px Arial,sans-serif}.arrow{fill:none;stroke:#375bd2;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1440" height="560" fill="#fafbfc" rx="24"/><rect width="250" height="120" x="60" y="80" class="box"/><text x="185" y="130" class="title">Application</text><text x="185" y="166" class="body">Describes the transaction</text><rect width="270" height="120" x="410" y="80" class="accent"/><text x="545" y="130" class="title">ACE Evaluation API</text><text x="545" y="166" class="body">Creates the evaluation</text><rect width="270" height="120" x="780" y="80" class="accent"/><text x="915" y="130" class="title">Managed CRE workflow</text><text x="915" y="166" class="body">Applies the risk policy</text><rect width="230" height="120" x="1150" y="80" class="box"/><text x="1265" y="130" class="title">TRM</text><text x="1265" y="166" class="body">Screens wallet addresses</text><path d="M 310 140 L 400 140" class="arrow"/><text x="355" y="120" class="label">POST /evaluate</text><path d="M 680 140 L 770 140" class="arrow"/><text x="725" y="120" class="label">Trigger</text><path d="M 1050 140 L 1140 140" class="arrow"/><text x="1095" y="120" class="label">Screen</text><path d="M 1265 210 C 1265 280, 1050 270, 1050 350" class="arrow"/><text x="1190" y="282" class="label">Approved</text><rect width="310" height="130" x="790" y="350" class="accent"/><text x="945" y="400" class="title">CADV contract</text><text x="945" y="436" class="body">Stores the single-use permit</text><rect width="290" height="130" x="390" y="350" class="box"/><text x="535" y="400" class="title">Protected transaction</text><text x="535" y="436" class="body">Matches and consumes permit</text><path d="M 790 415 L 690 415" class="arrow"/><text x="740" y="395" class="label">Permit ready</text><path d="M 390 415 C 250 415, 185 340, 185 210" class="arrow"/><text x="260" y="385" class="label">Submit after polling</text></svg>
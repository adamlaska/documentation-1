<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1120 720"><title id="title">CCIP Canton package dependencies</title><desc id="desc">Layered dependency diagram for CCIP Canton Daml packages, showing un-upgradeable base packages, interface packages, core packages, and third-party owned packages.</desc><defs><style>.label{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937}.section-title{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}.pkg-name{font-size:12px;font-weight:600}.pkg-version{font-size:10px;font-weight:500;opacity:.85}.legend-text{font-size:11px;font-weight:500}.arrow{stroke:#4b5563;stroke-width:1.5;fill:none;marker-end:url(#arrowhead)}</style><marker id="arrowhead" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#4b5563" d="M0,0 L6,3 L0,6 Z"/></marker><filter id="shadow" width="108%" height="108%" x="-4%" y="-4%"><feDropShadow dx="0" dy="1" flood-color="#000" flood-opacity=".08" stdDeviation="1.5"/></filter></defs><rect width="1120" height="720" fill="#fff"/><g transform="translate(760, 24)"><rect width="340" height="118" x="0" y="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" rx="8"/><text x="16" y="24" class="label legend-text" font-weight="700">Legend</text><rect width="14" height="14" x="16" y="36" fill="#fecaca" stroke="#dc2626" stroke-width="1.25" rx="3"/><text x="38" y="47" class="label legend-text">Un-upgradeable</text><rect width="14" height="14" x="16" y="58" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.25" rx="3"/><text x="38" y="69" class="label legend-text">Contains interfaces</text><rect width="14" height="14" x="16" y="80" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="3"/><text x="38" y="91" class="label legend-text">Core implementation</text><rect width="14" height="14" x="180" y="36" fill="#c5d9e8" stroke="#1565c0" stroke-width="1.25" rx="3"/><text x="202" y="47" class="label legend-text">Third-party owned</text><text x="16" y="110" fill="#6b7280" class="label legend-text">Downstream packages import upstream packages.</text></g><g transform="translate(40, 40)"><rect width="680" height="92" x="0" y="0" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)" rx="10"/><rect width="680" height="28" x="0" y="0" fill="#dc2626" rx="10"/><rect width="680" height="10" x="0" y="18" fill="#dc2626"/><text x="16" y="19" fill="#fff" class="label section-title">Un-upgradeable</text><g transform="translate(24, 42)"><rect width="190" height="38" x="0" y="0" fill="#fecaca" stroke="#dc2626" stroke-width="1.25" rx="6"/><text x="12" y="18" class="label pkg-name">chainlink-api</text><text x="12" y="31" class="label pkg-version">1.0.0</text><rect width="190" height="38" x="214" y="0" fill="#fecaca" stroke="#dc2626" stroke-width="1.25" rx="6"/><text x="226" y="18" class="label pkg-name">ccip-codec</text><text x="226" y="31" class="label pkg-version">1.0.0</text></g></g><path d="M 380 132 L 380 158" class="arrow"/><g transform="translate(40, 158)"><rect width="680" height="104" x="0" y="0" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)" rx="10"/><rect width="680" height="28" x="0" y="0" fill="#16a34a" rx="10"/><rect width="680" height="10" x="0" y="18" fill="#16a34a"/><text x="16" y="19" fill="#fff" class="label section-title">Interface packages</text><g transform="translate(24, 42)"><rect width="196" height="38" x="0" y="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.25" rx="6"/><text x="12" y="18" class="label pkg-name">ccip-api</text><text x="12" y="31" class="label pkg-version">1.0.0</text><rect width="210" height="38" x="212" y="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.25" rx="6"/><text x="224" y="18" class="label pkg-name">ccip-extension-api</text><text x="224" y="31" class="label pkg-version">1.0.0</text><rect width="210" height="38" x="438" y="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.25" rx="6"/><text x="450" y="18" class="label pkg-name">ccip-client-api</text><text x="450" y="31" class="label pkg-version">1.0.0</text></g></g><path d="M 380 262 L 380 288" class="arrow"/><g transform="translate(40, 288)"><rect width="680" height="104" x="0" y="0" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)" rx="10"/><rect width="680" height="28" x="0" y="0" fill="#546e7a" rx="10"/><rect width="680" height="10" x="0" y="18" fill="#546e7a"/><text x="16" y="19" fill="#fff" class="label section-title">Core packages</text><g transform="translate(24, 42)"><rect width="118" height="38" x="0" y="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="6"/><text x="10" y="18" class="label pkg-name">ccip-events</text><text x="10" y="31" class="label pkg-version">1.0.0</text><rect width="118" height="38" x="130" y="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="6"/><text x="140" y="18" class="label pkg-name">ccip-tickets</text><text x="140" y="31" class="label pkg-version">1.0.0</text><rect width="104" height="38" x="260" y="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="6"/><text x="270" y="18" class="label pkg-name">ccip-core</text><text x="270" y="31" class="label pkg-version">1.0.0</text><rect width="104" height="38" x="376" y="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="6"/><text x="386" y="18" class="label pkg-name">ccip-utils</text><text x="386" y="31" class="label pkg-version">1.0.0</text><rect width="118" height="38" x="492" y="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.25" rx="6"/><text x="502" y="18" class="label pkg-name">ccip-runtime</text><text x="502" y="31" class="label pkg-version">1.0.0</text></g></g><path d="M 380 392 L 380 418" class="arrow"/><g transform="translate(40, 418)"><rect width="1040" height="262" x="0" y="0" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)" rx="10"/><rect width="1040" height="28" x="0" y="0" fill="#1565c0" rx="10"/>